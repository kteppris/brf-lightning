# lightning.pytorch==2.5.1.post0
experiment_name: bearing_brf_stacked
seed_everything: 42

trainer:
  max_epochs: 30

# ─────────────────────── model ──────────────────────────────────────────
model:
  class_path: brf_lightning.models.BearingFaultClassifier
  init_args:
    num_classes: 3
    reduction: mean

    # ---------------- backbone replaced by Balanced‑RF ------------------
    backbone:
      class_path: brf_lightning.models.backbones.SimpleResRNN          # ← SAME
      init_args:
        input_size: 1                   # one vibration channel per window
        hidden_size: 6                  # six resonance neurons (outer & inner)
        output_size: 3

        # Balanced‑RF neuron parameters
        fs: 8192.0                      # Hz  (dt = 1/fs inside cell)   ← NEW
        carriers_khz: [1.91, 2.05, 2.20, 2.86, 3.08, 3.29]             # ← NEW
        half_bw_hz:      [512, 512, 512, 683, 683, 683]                  # ← NEW
        use_euler: false                # exact exponential map        # ← NEW

        # keep adaptive & pruning options from old config
        pruning: true
        mask_prob: 0.5
        adaptive_omega: true
        adaptive_b_off: true
        hidden_bias: false
        output_bias: false

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-2

lr_scheduler:
  class_path: torch.optim.lr_scheduler.LinearLR
  init_args:
    total_iters: ${trainer.max_epochs}

# ───────────────────── data (unchanged) ────────────────────────────────
data:
  class_path: brf_lightning.data.BearingDataModule
  init_args:
    filepaths:
      - data/bearing_thl_v1/fAII20.csv
      - data/bearing_thl_v1/fAII30.csv
      - data/bearing_thl_v1/n20.csv
      - data/bearing_thl_v1/n30.csv
      - data/bearing_thl_v1/fIII20.csv
      - data/bearing_thl_v1/fIII30.csv

    split_strategy: chronological
    val_ratio: 0.10
    test_ratio: 0.10
    keep_fraction: 0.05

    window_size: 1.0
    hop_size: 0.0
    order_domain_mode: none
    norm: global
    target_rms: 10.0

    balance_mode: global_min
    num_workers: 8
    batch_size: 32
