# lightning.pytorch==2.5.1
experiment_name: bearing_brf_time_rms025
seed_everything: 42

# ───────────────────── Trainer ─────────────────────
trainer:
  max_epochs: 30
  accelerator: auto
  devices: auto

# ───────────────────── Model ──────────────────────
model:
  class_path: brf_lightning.models.BearingFaultClassifier
  init_args:
    num_classes: 3                # 0 = normal, 1 = IR, 2 = OR
    reduction: mean
    implicit_normal: true         # backbone emits 2 logits, “normal” added
    backbone:
      class_path: brf_lightning.models.backbones.SpeedScaledBRFBackbone
      init_args:
        # ---------- BRF core ------------------------------------------
        input_size: 1
        hidden_size: 64
        num_classes: 2            # defect logits only
        dt: 0.005                 # shorter step → less leak
        adaptive_omega_a: 0.3
        adaptive_omega_b: 1.0
        adaptive_b_offset_a: 0.02 # lower initial threshold
        adaptive_b_offset_b: 0.20 # faster adaptation

        # ---------- speed scaling -------------------------------------
        speed_scale_alpha_init: 1.0   # divide logits by speed [Hz]
        speed_scale_learnable: false  # fixed 1 / f scaling
        speed_scale_bias: true        # learn bias after scaling
        speed_scale_eps: 1.0e-6

        # ---------- post-gain -----------------------------------------
        post_gain_auto: true
        post_gain_learnable: false
        post_gain_target_std: 1.0

# ─────────────────── Optimiser & LR ──────────────────
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1.0e-2

lr_scheduler:
  class_path: torch.optim.lr_scheduler.LinearLR
  init_args:
    total_iters: ${trainer.max_epochs}

# ─────────────────── DataModule ───────────────────────
data:
  class_path: brf_lightning.data.BearingDataModule
  init_args:
    filepaths:
      - data/bearing_thl_v1/fAII10.csv
      - data/bearing_thl_v1/fAII20.csv
      - data/bearing_thl_v1/fAII30.csv
      - data/bearing_thl_v1/n10.csv
      - data/bearing_thl_v1/n20.csv
      - data/bearing_thl_v1/n30.csv
      - data/bearing_thl_v1/fIII10.csv
      - data/bearing_thl_v1/fIII20.csv
      - data/bearing_thl_v1/fIII30.csv

    # ---------- split by nominal RPM -------------------------------
    split_strategy: file_speed
    split_by_speed:
      train: [10, 30]
      val:   [20]
      test:  [20]
    val_ratio:  0.05
    test_ratio: 0.05
    keep_fraction: 0.05

    # ---------- time-domain settings -------------------------------
    order_domain_mode: none        # stay in raw time axis
    window_size: 1.0               # seconds
    hop_size: 0.30                 # 30 % hop

    target_rms: 0.25               # boost amplitude → spikes
    norm: global
    balance_mode: global_min

    batch_size: 32
    num_workers: 8
