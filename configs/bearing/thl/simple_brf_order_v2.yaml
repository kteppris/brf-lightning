# ============================================================
#  BRF-LIF backbone v2.1  •  dt = 0.01  •  safe ω (5-25 rad/step)
# ============================================================

experiment_name: bearing_brf_v21_safe_omega
seed_everything: 42

trainer:
  max_epochs: 40
  accelerator: auto
  precision: 32
  deterministic: true
  log_every_n_steps: 50
  callbacks:
    - class_path: brf_lightning.callbacks.BRFDebug
      init_args:
        log_interval: 50

# --------------------------- Model --------------------------
model:
  class_path: brf_lightning.models.BearingFaultClassifier
  init_args:
    num_classes: 3
    reduction: last
    implicit_normal: true

    backbone:
      class_path: brf_lightning.models.backbones.BRFBackboneV2
      init_args:
        # ─── simulation clock ─────────────────────────────
        fs: 100.0                    # ⇒ dt = 0.01 step
        input_size: 1
        hidden_size: 64
        num_classes: 2

        # ─── ω initialisation (5-25 rad/step) ─────────────
        carrier_base_hz: 1.2         # “Hz” here ⇒ ω = 2π·f ≈ 5 rad/step
        carrier_step_hz: 0.2         # 0.8,1.2,…,3.6 Hz  ⇒ up to 23 rad/step
        carrier_count: 8
        omega_jitter: 0.05
        adaptive_omega: true
        adaptive_b: true

        # ─── neuron parameters ────────────────────────────
        theta_init: 0.030
        b_offset: 0.20
        baseline_rate: 0.04

        # ─── LIF read-out ─────────────────────────────────
        tau_ms: 5.0

        # ─── RMS scaler ───────────────────────────────────
        use_rms_scaler: true
        rms_target: 1.2

        # ─── logit gain ───────────────────────────────────
        post_gain_auto: true
        post_gain_target_std: 1.0

# ------------------------ Optimiser -------------------------
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 5e-3
    weight_decay: 1e-4

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 20        
    eta_min: 5e-4

# -------------------------- Data ----------------------------
data:
  class_path: brf_lightning.data.BearingDataModule
  init_args:
    filepaths:
      - data/bearing_thl_v1/fAII10.csv
      - data/bearing_thl_v1/fAII20.csv
      - data/bearing_thl_v1/fAII30.csv
      - data/bearing_thl_v1/n10.csv
      - data/bearing_thl_v1/n20.csv
      - data/bearing_thl_v1/n30.csv
      - data/bearing_thl_v1/fIII10.csv
      - data/bearing_thl_v1/fIII20.csv
      - data/bearing_thl_v1/fIII30.csv

    split_strategy: file_speed
    split_by_speed:
      train: [10, 30]
      val:   [20]
      test:  [20]
    val_ratio:  0.05
    test_ratio: 0.05
    keep_fraction: 0.05

    # order-domain resample (100 samples/rev ↔ dt=0.01 step)
    order_domain_mode: fixed
    samples_per_rev: 100
    window_size: 1
    hop_size: 0.30

    norm: global
    balance_mode: global_min
    batch_size: 32
    num_workers: 8
