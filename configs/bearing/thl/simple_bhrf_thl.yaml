# lightning.pytorch==2.5.1.post0
# For default values, see: configs/fit_base.yaml
experiment_name: bearing_simple_harmonic_res_rnn
seed_everything: 42
trainer:
  fast_dev_run: false
  max_epochs: 10
  val_check_interval: null
  check_val_every_n_epoch: 1
model:
  class_path: brf_lightning.models.BearingFaultClassifier
  init_args:
    num_classes: 3
    backbone:
      class_path: brf_snn.models.SimpleHarmonicRNN
      init_args:
        input_size: 1
        hidden_size: 36
        output_size: 3
        adaptive_omega_a: 157.0  # ~2*pi*25 Hz
        adaptive_omega_b: 377.0   # ~2*pi*60 Hz
        adaptive_b_offset_a: 0.0
        adaptive_b_offset_b: 1.0
        out_adaptive_tau_mem_mean: 800.0
        out_adaptive_tau_mem_std: 200.0
        label_last: true
    optimizer:
      class_path: torch.optim.Adam
      init_args:
        lr: 0.1 
    scheduler:
      class_path: torch.optim.lr_scheduler.LinearLR
      init_args:
        start_factor: 1.0
        end_factor: 0.0
        total_iters: 10
data:
  class_path: brf_lightning.data.BearingDataModule 
  init_args:
    filepaths:
      - data/bearing_thl_v1/fAII10.csv
      - data/bearing_thl_v1/fAII20.csv
      - data/bearing_thl_v1/fAII30.csv
      - data/bearing_thl_v1/n10.csv
      - data/bearing_thl_v1/n20.csv
      - data/bearing_thl_v1/n30.csv
      - data/bearing_thl_v1/fIII10.csv
      - data/bearing_thl_v1/fIII20.csv
      - data/bearing_thl_v1/fIII30.csv
    batch_size: 32
    val_ratio: 0.1
    test_ratio: 0.1
    keep_fraction: 0.1
    num_workers: 8
    window_size: 1.0
    hop_size: null
    amp_scale: 800.0
ckpt_path: null