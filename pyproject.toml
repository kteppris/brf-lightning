[project]
name = "brf-lightning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Keno Teppris", email = "keno.teppris@th-luebeck.de" }
]
requires-python = ">=3.12"
dependencies = [
    "brf-snn",
    "ipykernel>=6.29.5",
    "ipympl>=0.9.7",
    "jsonargparse[signatures]>=4.27.7",
    "jupyterlab>=4.4.4",
    "lightning>=2.5.1.post0",
    "mlflow>=2.22.0",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "scienceplots>=2.1.1",
    "seaborn>=0.13.2",
]

[project.scripts]
brf-lightning = "brf_lightning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
brf-snn = { git = "https://github.com/kteppris/brf-neurons.git" }
